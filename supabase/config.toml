# For full config options, see: https://supabase.com/docs/guides/local-development/cli/config

[project]
id = "your-project-ref" # Replace with your actual project ref from Supabase dashboard URL

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]

[storage]
enabled = true

[storage.buckets.datasets]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["text/csv", "application/octet-stream"]

[storage.buckets.models]
public = false
file_size_limit = "200MiB"
